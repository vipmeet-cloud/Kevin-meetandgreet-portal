    // SPA redirect for static hosts (GitHub Pages, S3, etc.)
    var path = window.location.pathname;
    var search = window.location.search;
    var hash = window.location.hash;
    window.location.replace('/' + (path ? '?redirect=' + encodeURIComponent(path + search + hash) : ''));
  </script>
</head>
